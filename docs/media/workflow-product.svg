<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Inkcadence product workflow">
  <title>Inkcadence product workflow</title>
  <rect width="1200" height="220" rx="24" fill="#faf7f0"/>
  <text x="36" y="36" font-family="Georgia, serif" font-size="20" fill="#16233a">Product workflow</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="28" y="58" width="170" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="113" y="94" font-size="15" font-weight="700" fill="#16233a">1. Assignment</text>
      <text x="113" y="118" font-size="12" fill="#6a7585">full pages + ink</text>
    </g>
    <g>
      <rect x="230" y="58" width="170" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="315" y="94" font-size="15" font-weight="700" fill="#16233a">2. Match style</text>
      <text x="315" y="118" font-size="12" fill="#6a7585">10 built-ins</text>
    </g>
    <g>
      <rect x="432" y="58" width="170" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="517" y="94" font-size="15" font-weight="700" fill="#16233a">3. Harvest</text>
      <text x="517" y="118" font-size="12" fill="#6a7585">crops + score</text>
    </g>
    <g>
      <rect x="634" y="58" width="170" height="92" rx="16" fill="#e8f0fe" stroke="#2f6fed"/>
      <text x="719" y="94" font-size="15" font-weight="700" fill="#16233a">4. Style pack</text>
      <text x="719" y="118" font-size="12" fill="#3a4a63">your hand</text>
    </g>
    <g>
      <rect x="836" y="58" width="150" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="911" y="94" font-size="15" font-weight="700" fill="#16233a">5. Write</text>
      <text x="911" y="118" font-size="12" fill="#6a7585">lined / blank</text>
    </g>
    <g>
      <rect x="1018" y="58" width="154" height="92" rx="16" fill="#177d4f"/>
      <text x="1095" y="94" font-size="15" font-weight="700" fill="#fff">6. Export</text>
      <text x="1095" y="118" font-size="12" fill="#e7f6ee">PNG · PDF</text>
    </g>
    <g fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round">
      <path d="M198 104 H230"/>
      <path d="M400 104 H432"/>
      <path d="M602 104 H634"/>
      <path d="M804 104 H836"/>
      <path d="M986 104 H1018"/>
    </g>
  </g>
</svg>
