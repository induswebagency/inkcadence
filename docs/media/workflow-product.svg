<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Inkcadence product workflow</title>
  <desc id="desc">Samples, glyph sheet, quality score, style pack, write, then print or PNG.</desc>
  <rect width="1200" height="220" rx="24" fill="#faf7f0"/>
  <g font-family="Segoe UI, Source Sans 3, sans-serif" text-anchor="middle">
    <g>
      <rect x="28" y="58" width="150" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="103" y="98" font-size="15" font-weight="700" fill="#16233a">1 · Samples</text>
      <text x="103" y="122" font-size="12" fill="#6a7585">pen, slant, stroke</text>
    </g>
    <g>
      <rect x="214" y="58" width="150" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="289" y="98" font-size="15" font-weight="700" fill="#16233a">2 · Sheet</text>
      <text x="289" y="122" font-size="12" fill="#6a7585">letterforms</text>
    </g>
    <g>
      <rect x="400" y="58" width="150" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="475" y="98" font-size="15" font-weight="700" fill="#16233a">3 · Quality</text>
      <text x="475" y="122" font-size="12" fill="#6a7585">score before save</text>
    </g>
    <g>
      <rect x="586" y="58" width="150" height="92" rx="16" fill="#e8f0fe" stroke="#2f6fed"/>
      <text x="661" y="98" font-size="15" font-weight="700" fill="#16233a">4 · Style pack</text>
      <text x="661" y="122" font-size="12" fill="#3a4a63">glyphs + ink</text>
    </g>
    <g>
      <rect x="772" y="58" width="150" height="92" rx="16" fill="#fffdf8" stroke="#d5dde8"/>
      <text x="847" y="98" font-size="15" font-weight="700" fill="#16233a">5 · Write</text>
      <text x="847" y="122" font-size="12" fill="#6a7585">classical or neural</text>
    </g>
    <g>
      <rect x="958" y="58" width="214" height="92" rx="16" fill="#177d4f" />
      <text x="1065" y="98" font-size="15" font-weight="700" fill="#fff">6 · Page</text>
      <text x="1065" y="122" font-size="12" fill="#e7f6ee">PNG, print, PDF</text>
    </g>
    <g fill="none" stroke="#2f6fed" stroke-width="2.4" stroke-linecap="round">
      <path d="M178 104 H214"/>
      <path d="M364 104 H400"/>
      <path d="M550 104 H586"/>
      <path d="M736 104 H772"/>
      <path d="M922 104 H958"/>
    </g>
  </g>
  <text x="36" y="36" font-family="Georgia, serif" font-size="20" fill="#16233a">Product workflow</text>
</svg>
