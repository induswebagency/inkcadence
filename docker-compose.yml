services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: inkcadence
      POSTGRES_PASSWORD: inkcadence
      POSTGRES_DB: inkcadence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkcadence -d inkcadence"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inkcadence:inkcadence@db:5432/inkcadence
      PORT: "8080"
      COOKIE_SECURE: "0"
      PG_POOL_MAX: "5"
    ports:
      - "8080:8080"

volumes:
  pgdata:
