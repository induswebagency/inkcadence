<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" role="img" aria-label="Inkcadence — your hand, on every page">
  <title>Inkcadence</title>
  <desc>Wordmark: a blue pen-nib icon followed by the word Inkcadence.</desc>

  <defs>
    <linearGradient id="wm-ink" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6fa0ff"/>
      <stop offset="0.45" stop-color="#2a5bd0"/>
      <stop offset="1" stop-color="#101f4a"/>
    </linearGradient>
  </defs>

