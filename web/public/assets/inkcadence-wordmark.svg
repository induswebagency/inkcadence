<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="620" height="160" role="img" aria-label="Inkcadence — your hand, on every page">
  <title>Inkcadence</title>
  <desc>Wordmark: a blue cadence waveform followed by the word Inkcadence.</desc>

  <defs>
    <linearGradient id="wm-ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fb6ff"/>
      <stop offset="0.48" stop-color="#2a5bd0"/>
      <stop offset="1" stop-color="#16307a"/>
    </linearGradient>
  </defs>

  <g transform="translate(16, 29) scale(0.75)">
    <path fill="none" stroke="url(#wm-ink)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
          d="M14 96 C26 96 28 32 44 32 C60 32 58 104 74 104 C90 104 92 40 112 40"/>
  </g>

  <text x="126" y="90" font-family="Georgia, 'Times New Roman', Times, serif"
        font-size="56" letter-spacing="-0.6" fill="#16233a">Ink<tspan fill="#2a5bd0">cadence</tspan></text>

  <text x="129" y="118" font-family="ui-sans-serif, system-ui, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" letter-spacing="3.1" fill="#68727f">YOUR HAND, ON EVERY PAGE</text>
</svg>
